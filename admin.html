<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel da Roleta | Gui Brinquedos</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--amarelo:#FBC02D;--azul-claro:#3CC3F5;--azul-esc:#0B5FB0;--azul:#1E8FE1;--fundo:#F4FAFF;--rosa:#EE8DC0;--texto:#123047;--verde:#5DBB63;--linha:#DCEBF8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Outfit,sans-serif;color:var(--texto);background:var(--fundo);min-height:100vh}
button,input,select{font:inherit}
.btn{border:0;cursor:pointer;border-radius:999px;padding:12px 22px;font-weight:800;background:var(--amarelo);color:var(--azul-esc);box-shadow:0 4px 0 #D69C0B}
.btn:disabled{opacity:.6;cursor:wait}
.btn-sec{border:2px solid var(--linha);background:#fff;color:var(--azul-esc);border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:16px;background:radial-gradient(circle at 50% 0%,#3CC3F5,#1E8FE1 45%,#0B5FB0)}
.caixa{background:#fff;border-radius:28px;padding:32px 24px;width:100%;max-width:380px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.caixa img{height:64px;margin-bottom:8px}
.caixa h1{font-size:1.4rem;color:var(--azul-esc);margin-bottom:18px}
.caixa form{display:grid;gap:10px}
.caixa input{padding:13px 16px;border-radius:14px;border:2px solid var(--linha);outline:none}
.caixa input:focus{border-color:var(--azul)}
.msg{color:#C62828;font-size:.9rem;min-height:1.2em}
/* painel */
#painel{display:none}
header{background:var(--azul);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header img{height:40px}
header h1{font-size:1.1rem;flex:1}
header .btn-sec{border-color:rgba(255,255,255,.5);background:transparent;color:#fff}
main{max-width:1200px;margin:0 auto;padding:20px 16px 40px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.card{background:#fff;border-radius:18px;padding:16px;border:1px solid var(--linha)}
.card small{display:block;color:#5b7590;font-size:.8rem}
.card b{font-size:1.8rem;color:var(--azul-esc)}
.premios{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{background:#fff;border:1px solid var(--linha);border-radius:999px;padding:6px 12px;font-size:.85rem}
.chip b{color:var(--azul)}
.filtros{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.filtros input,.filtros select{padding:10px 14px;border-radius:999px;border:2px solid var(--linha);background:#fff;outline:none}
.filtros input{flex:1;min-width:200px}
.tabela{background:#fff;border-radius:18px;border:1px solid var(--linha);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem;min-width:820px}
th{text-align:left;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:#5b7590;padding:12px 14px;border-bottom:1px solid var(--linha);background:#F9FCFF}
td{padding:12px 14px;border-bottom:1px solid var(--linha);vertical-align:middle}
tr:last-child td{border-bottom:0}
td a{color:var(--azul);text-decoration:none;font-weight:600}
.cod{font-family:ui-monospace,Menlo,monospace;font-size:.85rem;background:#EEF6FF;padding:3px 8px;border-radius:8px}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:700;white-space:nowrap}
.t-ok{background:#E5F6E6;color:#2E7D32}.t-pend{background:#FFF4D6;color:#8A6100}
.acao{border:0;cursor:pointer;border-radius:999px;padding:6px 12px;font-weight:700;font-size:.8rem;background:#EEF6FF;color:var(--azul-esc)}
.vazio{padding:40px;text-align:center;color:#5b7590}
.rodape{font-size:.8rem;color:#5b7590;margin-top:10px}
</style>
</head>

    <h1>Participantes da Roleta</h1>
    <button class="btn-sec" id="bSair">Sair</button>
  </header>
  <main>
    <div class="cards">
      <div class="card"><small>Cadastros</small><b id="cTotal">0</b></div>
      <div class="card"><small>Hoje</small><b id="cHoje">0</b></div>
      <div class="card"><small>Últimos 7 dias</small><b id="cSemana">0</b></div>
      <div class="card"><small>Prêmios resgatados</small><b id="cResg">0</b></div>
    </div>
    <div class="premios" id="porPremio"></div>
    <div class="filtros">
      <input id="busca" placeholder="Buscar por nome, WhatsApp, @ ou código">
      <select id="fPremio"><option value="">Todos os prêmios</option></select>
      <select id="fStatus"><option value="">Todos</option><option value="pend">Não resgatados</option><option value="ok">Resgatados</option></select>
      <button class="btn-sec" id="bAtualizar">↻ Atualizar</button>
      <button class="btn-sec" id="bCsv">⬇ Baixar planilha</button>
    </div>
    <div class="tabela">
      <table>
        <thead><tr><th>Data</th><th>Nome</th><th>WhatsApp</th><th>Instagram</th><th>Prêmio</th><th>Código</th><th>Status</th><th></th></tr></thead>
        <tbody id="linhas"></tbody>
      </table>
    </div>
    <p class="rodape" id="info"></p>
  </main>
</section>

<script>
// mesmos valores colados no roleta (index.html)
const SUPABASE_URL = "https://lsohcizhhxxnzsgirksd.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxzb2hjaXpoaHh4bnpzZ2lya3NkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUyMTgyMTIsImV4cCI6MjExMDc5NDIxMn0.5qUboPxxuCHZxNtwmCG2551dkueVcgE1cMRe_IomMjg";
const $ = id => document.getElementById(id);
let sessao = null, dados = [];
try { sessao = JSON.parse(sessionStorage.getItem("painelRoleta")); } catch (e) {}

async function api(caminho, opcoes = {}) {
  const r = await fetch(SUPABASE_URL + caminho, {...opcoes, headers: {"Content-Type": "application/json", apikey: SUPABASE_ANON, Authorization: `Bearer ${sessao ? sessao.access_token : SUPABASE_ANON}`, ...(opcoes.headers || {})}});
  if (r.status === 401) { sair(); throw new Error("Sessão expirada. Entre de novo."); }
  const t = await r.text(), j = t ? JSON.parse(t) : null;
  if (!r.ok) throw new Error((j && (j.error_description || j.msg || j.message)) || "Erro " + r.status);
  return j;
}

$("fLogin").addEventListener("submit", async e => {
  e.preventDefault(); $("msgLogin").textContent = ""; $("bEntrar").disabled = true;
  try {
    sessao = await api("/auth/v1/token?grant_type=password", {method: "POST", body: JSON.stringify({email: $("email").value.trim(), password: $("senha").value})});
    try { sessionStorage.setItem("painelRoleta", JSON.stringify(sessao)); } catch (e) {}
    $("senha").value = ""; abrePainel();
  } catch (err) {
    $("msgLogin").textContent = /invalid/i.test(err.message) ? "E-mail ou senha incorretos." : err.message;
  }
  $("bEntrar").disabled = false;
});

function sair() {
  sessao = null; try { sessionStorage.removeItem("painelRoleta"); } catch (e) {}
  $("painel").style.display = "none"; $("login").style.display = "grid";
}
$("bSair").onclick = sair;

async function abrePainel() {
  $("login").style.display = "none"; $("painel").style.display = "block";
  await carrega();
}
async function carrega() {
  $("info").textContent = "Carregando...";
  try {
    dados = await api("/rest/v1/roleta_participantes?select=*&order=criado_em.desc&limit=10000");
    if (!dados.length && sessao) $("info").textContent = "";
    montaFiltros(); desenha();
  } catch (err) { $("info").textContent = err.message; }
}
$("bAtualizar").onclick = carrega;

const fmtData = d => new Date(d).toLocaleString("pt-BR", {day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit"});
const fmtTel = t => t.length === 11 ? `(${t.slice(0, 2)}) ${t.slice(2, 7)}-${t.slice(7)}` : t.length === 10 ? `(${t.slice(0, 2)}) ${t.slice(2, 6)}-${t.slice(6)}` : t;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

function montaFiltros() {
  const premios = [...new Set(dados.map(d => d.premio))], atual = $("fPremio").value;
  $("fPremio").innerHTML = '<option value="">Todos os prêmios</option>' + premios.map(p => `<option${p === atual ? " selected" : ""}>${esc(p)}</option>`).join("");
  const hoje = new Date().toDateString(), semana = Date.now() - 7 * 864e5;
  $("cTotal").textContent = dados.length;
  $("cHoje").textContent = dados.filter(d => new Date(d.criado_em).toDateString() === hoje).length;
  $("cSemana").textContent = dados.filter(d => new Date(d.criado_em) >= semana).length;
  $("cResg").textContent = dados.filter(d => d.resgatado).length;
  const cont = {}; dados.forEach(d => cont[d.premio] = (cont[d.premio] || 0) + 1);
  $("porPremio").innerHTML = Object.entries(cont).sort((a, b) => b[1] - a[1]).map(([p, n]) => `<span class="chip">${esc(p)}: <b>${n}</b></span>`).join("");
}

function filtrados() {
  const q = $("busca").value.trim().toLowerCase().replace(/^@/, ""), qn = q.replace(/\D/g, ""), fp = $("fPremio").value, fs = $("fStatus").value;
  return dados.filter(d =>
    (!fp || d.premio === fp) && (!fs || (fs === "ok") === d.resgatado) &&
    (!q || d.nome.toLowerCase().includes(q) || d.instagram.includes(q) || d.codigo.toLowerCase().includes(q) || (qn && d.whatsapp.includes(qn))));
}

function desenha() {
  const lista = filtrados();
  $("linhas").innerHTML = lista.length ? lista.map(d => `<tr>
    <td>${fmtData(d.criado_em)}</td>
    <td><b>${esc(d.nome)}</b></td>
    <td><a href="https://wa.me/55${d.whatsapp}" target="_blank" rel="noopener">${fmtTel(d.whatsapp)}</a></td>
    <td><a href="https://instagram.com/${esc(d.instagram)}" target="_blank" rel="noopener">@${esc(d.instagram)}</a></td>
    <td>${esc(d.premio)}</td>
    <td><span class="cod">${esc(d.codigo)}</span></td>
    <td>${d.resgatado ? `<span class="tag t-ok">Resgatado ${d.resgatado_em ? new Date(d.resgatado_em).toLocaleDateString("pt-BR") : ""}</span>` : '<span class="tag t-pend">Pendente</span>'}</td>
    <td><button class="acao" data-id="${d.id}" data-r="${d.resgatado ? 0 : 1}">${d.resgatado ? "Desfazer" : "Marcar resgatado"}</button></td>
  </tr>`).join("") : `<tr><td colspan="8" class="vazio">${dados.length ? "Nenhum resultado para esse filtro." : "Ainda não tem ninguém cadastrado."}</td></tr>`;
  $("info").textContent = `Mostrando ${lista.length} de ${dados.length} cadastros.`;
}
["busca", "fPremio", "fStatus"].forEach(id => $(id).addEventListener("input", desenha));

$("linhas").addEventListener("click", async e => {
  const b = e.target.closest(".acao"); if (!b) return;
  b.disabled = true;
  const r = b.dataset.r === "1";
  try {
    await api(`/rest/v1/roleta_participantes?id=eq.${b.dataset.id}`, {method: "PATCH", headers: {Prefer: "return=minimal"}, body: JSON.stringify({resgatado: r, resgatado_em: r ? new Date().toISOString() : null})});
    const d = dados.find(x => x.id == b.dataset.id); d.resgatado = r; d.resgatado_em = r ? new Date().toISOString() : null;
    montaFiltros(); desenha();
  } catch (err) { alert(err.message); b.disabled = false; }
});

$("bCsv").onclick = () => {
  const cab = ["Data", "Nome", "WhatsApp", "Instagram", "Prêmio", "Código", "Resgatado", "Data do resgate"];
  const linhas = filtrados().map(d => [fmtData(d.criado_em), d.nome, fmtTel(d.whatsapp), "@" + d.instagram, d.premio, d.codigo, d.resgatado ? "Sim" : "Não", d.resgatado_em ? new Date(d.resgatado_em).toLocaleDateString("pt-BR") : ""]);
  const csv = [cab, ...linhas].map(l => l.map(c => `"${String(c).replace(/"/g, '""')}"`).join(";")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], {type: "text/csv;charset=utf-8"}));
  a.download = `roleta-participantes-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
};

if (sessao) abrePainel();
</script>
</body>
</html>
